name: CI
on:
  pull_request:
  push:
    branches: [main]
    # Image Updater's digest write-back: building on it would push a new digest, and loop.
    paths-ignore: [deploy/.argocd-source-sdlc-board.yaml]
  # To build an APK from a branch before its PR (android/README.md).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The web build: what compiles natively may not for the browser.
      - run: cargo clippy -p board-app --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Android app (android/, ADR 0002). GitHub-hosted: its image has the
  # Android SDK and NDK, and AGP needs more memory than the homelab runners.
  # The signed APK is this run's sdlc-board-apk artifact.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_NDK_VERSION: 4.1.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android && rustup default stable
      - run: cargo install --locked cargo-ndk --version "$CARGO_NDK_VERSION"
      # The committed bindings must be what this board-ffi generates.
      - name: Bindings are fresh
        run: |
          cargo build -p board-ffi --locked
          cargo run -p board-ffi --features bindgen --bin uniffi-bindgen --locked -- \
            generate target/debug/libboard_ffi.so --language kotlin --out-dir android/core/src/main/kotlin --no-format
          git diff --exit-code -- android/core || {
            echo "::error::android/core's bindings are stale: regenerate them (android/README.md) and commit."; exit 1; }
      - name: board-ffi for arm64 phones
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p board-ffi --release --locked
      - name: Test and build
        working-directory: android
        run: ./gradlew :core:test :app:assembleRelease -Pboard.versionCode=${{ github.run_number }}
      # The release key (android/README.md). Without it, as on Dependabot PRs, a throwaway
      # key signs the APK, which can't update an install signed with the real one.
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$ks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key."
            PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$ks" -storepass "$PASSWORD" -keypass "$PASSWORD" -alias board \
              -keyalg RSA -keysize 2048 -validity 30 -dname CN=throwaway
          fi
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          export PASSWORD
          "$tools/apksigner" sign --ks "$ks" --ks-pass env:PASSWORD --out sdlc-board.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/apksigner" verify --print-certs sdlc-board.apk
          rm -f "$ks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-board-apk
          path: sdlc-board.apk
          if-no-files-found: error
          retention-days: 30

  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - run: helm lint deploy
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL --max-time 120 "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate rendered manifests
        shell: bash # with pipefail, so a helm error fails the job
        run: |
          helm template sdlc-board deploy | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

  # Built on every PR, so a broken Dockerfile fails it; pushed from main.
  image:
    needs: [cargo, deploy]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # :latest only if main's head builds the same image, so a slow older run can't
      # overwrite a newer one, and Image Updater's write-back (no run of its own) doesn't count.
      - name: Decide tags
        id: tags
        if: github.ref == 'refs/heads/main'
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/sdlc-board"
          tags="$repo:${{ github.sha }}"
          git fetch --quiet --depth=1 origin main
          if git diff --quiet ${{ github.sha }} FETCH_HEAD -- . ':!deploy/.argocd-source-sdlc-board.yaml'; then
            tags="$tags,$repo:latest"
          else
            echo "::notice::main moved on; leaving :latest to that run."
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.tags.outputs.tags != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ steps.tags.outputs.tags != '' }}
          # The attestation changes the digest on every build, which would restart the pod for nothing.
          provenance: false
          tags: ${{ steps.tags.outputs.tags || 'sdlc-board:ci' }}
          cache-from: type=gha,scope=board
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=board' || '' }}
