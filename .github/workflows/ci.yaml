name: CI
on:
  pull_request:
  push:
    branches: [main]
    # Image Updater's digest write-back: building on it would push a new digest, and loop.
    paths-ignore: [deploy/.argocd-source-sdlc-board.yaml]
permissions:
  contents: read
jobs:
  cargo:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The web build: what compiles natively may not for the browser.
      - run: cargo clippy -p board-app --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Android build (crates/android). GitHub-hosted, whose image carries
  # the Android SDK and NDK. The APK is this run's sdlc-board-apk artifact.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component clippy --target aarch64-linux-android && rustup default stable
      - run: cargo install --locked cargo-apk --version 0.10.0
      - run: cargo apk -- clippy -p board-android --locked -- -D warnings
      # The release key (docs/STATUS.md). Without it, as on Dependabot PRs,
      # a throwaway key signs the APK, which can't update an install signed with the real one.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$ks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway key."
            PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$ks" -storepass "$PASSWORD" -keypass "$PASSWORD" -alias board \
              -keyalg RSA -keysize 2048 -validity 30 -dname CN=throwaway
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - run: cargo apk build -p board-android --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdlc-board-apk
          path: target/release/apk/sdlc-board.apk
          if-no-files-found: error

  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - run: helm lint deploy
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL --max-time 120 "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate rendered manifests
        shell: bash # with pipefail, so a helm error fails the job
        run: |
          helm template sdlc-board deploy | kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

  # Built on every PR, so a broken Dockerfile fails it; pushed from main.
  image:
    needs: [cargo, deploy]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # :latest only if main's head builds the same image, so a slow older run can't
      # overwrite a newer one, and Image Updater's write-back (no run of its own) doesn't count.
      - name: Decide tags
        id: tags
        if: github.ref == 'refs/heads/main'
        run: |
          repo="ghcr.io/${{ github.repository_owner }}/sdlc-board"
          tags="$repo:${{ github.sha }}"
          git fetch --quiet --depth=1 origin main
          if git diff --quiet ${{ github.sha }} FETCH_HEAD -- . ':!deploy/.argocd-source-sdlc-board.yaml'; then
            tags="$tags,$repo:latest"
          else
            echo "::notice::main moved on; leaving :latest to that run."
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.tags.outputs.tags != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ steps.tags.outputs.tags != '' }}
          # The attestation changes the digest on every build, which would restart the pod for nothing.
          provenance: false
          tags: ${{ steps.tags.outputs.tags || 'sdlc-board:ci' }}
          cache-from: type=gha,scope=board
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=board' || '' }}
