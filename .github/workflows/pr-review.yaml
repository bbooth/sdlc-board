# The ticket pipeline's PR review gate, from bbooth/agentic-sdlc. Bump both
# SHAs together to take a newer version of the gate.
name: PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-review:
    uses: bbooth/agentic-sdlc/.github/workflows/pr-review.yaml@4bf7cd9f96a7fedfb5fb5d489f937fca38d2242a
    with:
      sdlc-ref: 4bf7cd9f96a7fedfb5fb5d489f937fca38d2242a
      runner: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
