[package]
name = "board-ffi"
version = "0.1.0"
edition.workspace = true

# board-core for Kotlin (ADR 0002): the Android app calls it through the
# UniFFI bindings committed under android/core.
[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

# Only the bindings generator needs UniFFI's CLI, so the Android library doesn't carry it.
[features]
bindgen = ["uniffi/cli"]

[dependencies]
board-api = { version = "0.1.0", path = "../api" }
board-core = { version = "0.1.0", path = "../core" }
uniffi = "0.33.0"

[dev-dependencies]
serde_json = "1.0.154"
