[package]
name = "board-setup"
version = "0.1.0"
edition.workspace = true

# The owner's one-time setup of the board on the cluster, run from a
# checkout on Omarchy; not part of the image.
[dependencies]
anyhow = "1.0.105"
board-server = { version = "0.1.0", path = "../server" }
serde_json = "1.0.154"
ureq = "3.5.2"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
