[package]
name = "board-android"
version = "0.1.0"
edition.workspace = true

# Android loads the app as a shared library and starts it at `android_main`.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
board-app = { version = "0.1.0", path = "../app" }
eframe = { version = "0.37.0", default-features = false, features = ["android-native-activity"] }
log = "0.4.35"
winit = "0.30.13"

# `cargo apk build -p board-android --release` (docs/STATUS.md).
[package.metadata.android]
package = "com.trulinc.sdlcboard"
apk_name = "sdlc-board"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "SDLC board"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
