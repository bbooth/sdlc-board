[package]
name = "board-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
board-api = { version = "0.1.0", path = "../api" }
# accesskit, a default feature, doesn't build with Android's native activity.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# std's Instant natively, the browser's clock on wasm, where std's panics.
web-time = "1.1.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.37.0"

# The native fetch (ADR 0001).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3.5.2"

# The web build fetches with the browser's fetch and an AbortSignal deadline.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["AbortSignal", "Document", "Location", "console", "HtmlCanvasElement", "Request", "RequestInit", "RequestRedirect", "Response", "ResponseType", "Window"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }
tempfile = "3.27.0"
