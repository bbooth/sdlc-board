[package]
name = "board-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
board-api = { version = "0.1.0", path = "../api" }
board-core = { version = "0.1.0", path = "../core" }
eframe = "0.37.0"
serde_json = "1.0.154"
# std's Instant natively, the browser's clock on wasm, where std's panics.
web-time = "1.1.0"

# The web build fetches with the browser's fetch and an AbortSignal deadline.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["AbortSignal", "Document", "Location", "console", "HtmlCanvasElement", "Request", "RequestInit", "RequestRedirect", "Response", "ResponseType", "Window"] }

[dev-dependencies]
egui_kittest = "0.37.0"
