{{- $access := .Values.access }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sdlc-board
data:
  board.toml: |
    [access]
    issuer = {{ required "access.issuer: the Access team URL" $access.issuer | quote }}
    aud = {{ required "access.aud: the Access application's AUD tag" $access.aud | quote }}
    {{- range .Values.repos }}

    [[repos]]
    name = {{ .name | quote }}
    linear_team = {{ .linearTeam | quote }}
    linear_project = {{ .linearProject | quote }}
    {{- with .rolloutNamespace }}
    rollout_namespace = {{ . | quote }}
    {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdlc-board
  labels:
    app.kubernetes.io/name: sdlc-board
spec:
  # One replica: each would read Linear and GitHub itself.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sdlc-board
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdlc-board
      annotations:
        # A settings change restarts the pod, which reads board.toml once.
        checksum/config: {{ .Values | toJson | sha256sum }}
    spec:
      serviceAccountName: sdlc-board
      # The token reads Rollouts (rbac.yaml) and nothing else.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ ternary "Always" "IfNotPresent" (eq .Values.image.tag "latest") }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LINEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokensSecret }}
                  key: LINEAR_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tokensSecret }}
                  key: GITHUB_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: config
              mountPath: /etc/board
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: sdlc-board
---
apiVersion: v1
kind: Service
metadata:
  name: sdlc-board
  labels:
    app.kubernetes.io/name: sdlc-board
spec:
  selector:
    app.kubernetes.io/name: sdlc-board
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9091
      targetPort: 9091
---
# Every route names its hostnames: the Gateway is shared with other apps.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sdlc-board
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      sectionName: web
  hostnames:
    {{- toYaml .Values.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sdlc-board
          port: 8080
---
# release: prometheus -- the Prometheus CR only selects ServiceMonitors with this label.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sdlc-board
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sdlc-board
  endpoints:
    - port: metrics
      path: /metrics
