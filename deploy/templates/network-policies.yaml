# Ingress only: Traefik reaches the public port, Prometheus the metrics
# port, and nothing else reaches the pod. Egress stays open for Linear,
# GitHub, Cloudflare's keys and the cluster's API (Rollouts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sdlc-board
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sdlc-board
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9091
