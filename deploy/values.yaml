# Routed by the Cloudflare Tunnel to the shared Traefik Gateway, behind Access.
hostnames:
  - board.trulinc.com

# The Access application in front of hostnames (argocd/README.md); not secrets.
access:
  # https://<team>.cloudflareaccess.com
  issuer: ""
  # The application's Application Audience (AUD) tag.
  aud: ""

# board.toml's repos.
repos:
  - name: bbooth/booking
    linearTeam: TRU
    linearProject: Booking
  - name: bbooth/sdlc-board
    linearTeam: TRU
    linearProject: SDLC board

# Applied by hand (argocd/README.md): LINEAR_API_KEY, optional GITHUB_TOKEN.
tokensSecret: sdlc-board-tokens

# image.tag is what ArgoCD Image Updater pins (argocd/application.yaml).
image:
  repository: ghcr.io/bbooth/sdlc-board
  tag: latest
# Applied by hand while the GHCR package is private; [] once it's public.
imagePullSecrets:
  - ghcr-pull

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
